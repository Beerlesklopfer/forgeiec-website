# nginx snippet for the ForgeIEC contact form backend.
#
# 1. The limit_req_zone line belongs in the http {} context, e.g. in
#    /etc/nginx/conf.d/forgeiec-contact-zone.conf.
# 2. The location block belongs inside the existing server {} block of
#    forgeiec.io (the HTTPS one), e.g. via
#    include /etc/nginx/snippets/forgeiec-contact.conf;
# Then: nginx -t && systemctl reload nginx
#
# The port must match CONTACT_PORT in /etc/forgeiec-contact/env.

# --- http {} context ---------------------------------------------------------
# 10 requests per minute per client address for the whole API (token +
# submit); the backend applies the stricter per-IP mail limit itself.
limit_req_zone $binary_remote_addr zone=forgeiec_contact:1m rate=10r/m;

# --- server {} context ---------------------------------------------------------
location /api/contact/ {
    limit_req zone=forgeiec_contact burst=5 nodelay;
    limit_req_status 429;

    client_max_body_size 20k;
    client_body_buffer_size 20k;

    # Only the two methods the backend uses.
    limit_except GET POST { deny all; }

    proxy_pass http://127.0.0.1:8724;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Connection "";
    # Overwrite (not append) so a client cannot inject its own address.
    proxy_set_header X-Forwarded-For $remote_addr;
    # The backend never sets cookies; drop any the client sends.
    proxy_set_header Cookie "";

    proxy_connect_timeout 5s;
    proxy_send_timeout 20s;
    proxy_read_timeout 30s;
    proxy_buffering on;
    proxy_request_buffering on;

    # Optional: keep personal data out of the access log for this path.
    # access_log off;
}
