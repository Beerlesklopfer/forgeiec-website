baseURL = 'https://forgeiec.io/'
title = 'ForgeIEC'
defaultContentLanguage = 'de'
defaultContentLanguageInSubdir = true
enableRobotsTXT = true

# Only German and English are maintained. The content directories of
# ar, es, fr, ja, tr and zh stay in the repository, but the languages
# are not configured here and therefore not built (owner's decision,
# 2026-10-22). To revive one, add its [languages.xx] block again.

# News posts may be published with today's date even if UTC is still
# before the midnight anchor (Hugo treats a date without time as 00:00 UTC).
buildFuture = true

[params]
description = "Steuerungssoftware nach IEC 61131-3 für Maschinen- und Anlagenbauer"
contact = "blacksmith@forgeiec.io"
images = ["img/og.png"]

[markup.goldmark.renderer]
unsafe = true

[markup.highlight]
noClasses = false

# ---- Languages ----
[languages]

  [languages.de]
  label = "Deutsch"
  locale = "de-DE"
  weight = 1
  title = "ForgeIEC"
  contentDir = "content/de"
    [languages.de.params]
    description = "Steuerungssoftware nach IEC 61131-3 für Maschinen- und Anlagenbauer"
    ctaLabel = "Pilotprojekt anfragen"
    ctaSubject = "Pilotprojekt ForgeIEC"
