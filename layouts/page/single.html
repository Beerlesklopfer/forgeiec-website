{{ define "main" }}

{{/* Same hero layout as home + section landings — keeps CID consistent
     across every page type (single posts, help sub-pages, partner,
     download details, etc.). */}}
<section class="hero">
  <div class="hero-bg"></div>
  <div class="container hero-content">
    <h1 class="hero-title">{{ .Title }}</h1>
    <div class="hero-body">
      {{ .Content }}
    </div>
  </div>
</section>

{{ end }}
