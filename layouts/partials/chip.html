{{- /* Status chip in words. dict "s" (use|wip|plan|rest) "label" (optional override). */ -}}
{{- $labels := dict "use" (i18n "statusUse") "wip" (i18n "statusWip") "plan" (i18n "statusPlan") "rest" (i18n "statusRest") -}}
<span class="chip chip--{{ .s }}">{{ .label | default (index $labels .s) }}</span>
