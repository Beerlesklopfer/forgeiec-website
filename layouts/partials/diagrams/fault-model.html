{{- /* Fault model: states and allowed transitions (wiki Platform, tongs_core::can_transition). */ -}}
{{- $de := eq .page.Language.Lang "de" -}}
{{- $id := .id -}}
{{- define "partials/diagrams/_state.html" -}}
<rect class="{{ .cls }}" x="{{ .x }}" y="{{ .y }}" width="120" height="44" rx="22"/>
<text class="t-b" x="{{ add .x 60 }}" y="{{ add .y 27 }}" text-anchor="middle">{{ .n }}</text>
{{- end -}}
<svg class="diagram" viewBox="0 0 960 380" role="img" aria-labelledby="{{ $id }}-t" xmlns="http://www.w3.org/2000/svg">
  <title id="{{ $id }}-t">{{ if $de }}Fehlermodell: zehn Zustände und die erlaubten Übergänge{{ else }}Fault model: ten states and the allowed transitions{{ end }}</title>
  <defs>
    <marker id="{{ $id }}-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="arrowhead" d="M0,0 L10,5 L0,10 z"/></marker>
  </defs>
  <!-- edges -->
  <line class="line" x1="152" y1="162" x2="206" y2="162" marker-end="url(#{{ $id }}-a)"/>
  <line class="line" x1="90" y1="138" x2="90" y2="78" marker-end="url(#{{ $id }}-a)"/>
  <line class="line" x1="152" y1="60" x2="238" y2="136" marker-end="url(#{{ $id }}-a)"/>
  <line class="line" x1="285" y1="138" x2="285" y2="78" marker-end="url(#{{ $id }}-a)"/>
  <line class="line" x1="310" y1="78" x2="310" y2="136" marker-end="url(#{{ $id }}-a)"/>
  <text class="t-sm" x="318" y="112">reload</text>
  <line class="line" x1="332" y1="150" x2="426" y2="90" marker-end="url(#{{ $id }}-a)"/>
  <line class="line" x1="490" y1="106" x2="490" y2="216" marker-start="url(#{{ $id }}-a)" marker-end="url(#{{ $id }}-a)"/>
  <line class="line" x1="552" y1="78" x2="646" y2="78" marker-end="url(#{{ $id }}-a)"/>
  <line class="line" x1="552" y1="96" x2="646" y2="226" marker-end="url(#{{ $id }}-a)"/>
  <line class="line" x1="552" y1="226" x2="646" y2="96" marker-end="url(#{{ $id }}-a)"/>
  <line class="line" x1="552" y1="244" x2="646" y2="244" marker-end="url(#{{ $id }}-a)"/>
  <line class="line" x1="772" y1="90" x2="838" y2="138" marker-end="url(#{{ $id }}-a)"/>
  <line class="line" x1="772" y1="232" x2="838" y2="186" marker-end="url(#{{ $id }}-a)"/>
  <path class="line" d="M300,186 L300,326 L710,326 L710,270" marker-end="url(#{{ $id }}-a)"/>
  <path class="line" d="M880,186 L880,356 L250,356 L250,188" marker-end="url(#{{ $id }}-a)"/>
  <text class="t-sm" x="560" y="350">{{ if $de }}nächster Versuch: 1, 2, 4, 8, 16, dann 30 s{{ else }}next attempt: 1, 2, 4, 8, 16, then 30 s{{ end }}</text>

  <!-- states -->
  {{ partial "diagrams/_state.html" (dict "cls" "box-2" "x" 30 "y" 140 "n" "Unknown") }}
  {{ partial "diagrams/_state.html" (dict "cls" "box-2" "x" 30 "y" 34 "n" "Disabled") }}
  {{ partial "diagrams/_state.html" (dict "cls" "box" "x" 210 "y" 140 "n" "Connecting") }}
  {{ partial "diagrams/_state.html" (dict "cls" "box" "x" 230 "y" 34 "n" "ConfigError") }}
  {{ partial "diagrams/_state.html" (dict "cls" "box-accent" "x" 430 "y" 60 "n" "Online") }}
  {{ partial "diagrams/_state.html" (dict "cls" "box-accent" "x" 430 "y" 220 "n" "Degraded") }}
  {{ partial "diagrams/_state.html" (dict "cls" "box" "x" 650 "y" 60 "n" "Timeout") }}
  {{ partial "diagrams/_state.html" (dict "cls" "box" "x" 650 "y" 222 "n" "Unreachable") }}
  {{ partial "diagrams/_state.html" (dict "cls" "box" "x" 820 "y" 140 "n" "Backoff") }}

  <!-- notes -->
  <text class="t-sm" x="30" y="236">{{ if $de }}Jeder Zustand außer Shutdown{{ else }}Every state except Shutdown{{ end }}</text>
  <text class="t-sm" x="30" y="254">{{ if $de }}führt nach Shutdown (Ende).{{ else }}leads to Shutdown (the end).{{ end }}</text>
  <rect class="box-accent" x="640" y="10" width="22" height="14" rx="4"/>
  <text class="t-sm" x="670" y="22">{{ if $de }}Werte sind vertrauenswürdig{{ else }}values can be trusted{{ end }}</text>
</svg>
