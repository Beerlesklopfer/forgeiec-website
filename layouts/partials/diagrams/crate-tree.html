{{- /* Crate dependency tree of tongs-core (wiki Architecture §3). Arrow = "uses". */ -}}
{{- $de := eq .page.Language.Lang "de" -}}
{{- $id := .id -}}
<svg class="diagram" viewBox="0 0 960 420" role="img" aria-labelledby="{{ $id }}-t" xmlns="http://www.w3.org/2000/svg">
  <title id="{{ $id }}-t">{{ if $de }}Abhängigkeitsbaum der Crates von tongs-core{{ else }}Crate dependency tree of tongs-core{{ end }}</title>
  <defs>
    <marker id="{{ $id }}-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="arrowhead" d="M0,0 L10,5 L0,10 z"/></marker>
  </defs>

  <!-- edges first, boxes on top -->
  <line class="line" x1="160" y1="82" x2="160" y2="116" marker-end="url(#{{ $id }}-a)"/>
  <line class="line" x1="282" y1="74" x2="404" y2="117" marker-end="url(#{{ $id }}-a)"/>
  <line class="line" x1="282" y1="150" x2="366" y2="150" marker-end="url(#{{ $id }}-a)"/>
  <line class="line" x1="160" y1="182" x2="160" y2="226" marker-end="url(#{{ $id }}-a)"/>
  <line class="line" x1="160" y1="292" x2="160" y2="336" marker-end="url(#{{ $id }}-a)"/>
  <line class="line" x1="480" y1="182" x2="480" y2="226" marker-end="url(#{{ $id }}-a)"/>
  <line class="line" x1="592" y1="260" x2="676" y2="260" marker-end="url(#{{ $id }}-a)"/>
  <line class="line" x1="592" y1="176" x2="700" y2="227" marker-end="url(#{{ $id }}-a)"/>
  <line class="line line-dash" x1="592" y1="150" x2="676" y2="150" marker-end="url(#{{ $id }}-a)"/>
  <text class="t-sm" x="600" y="140">feature bus</text>
  <line class="line line-dash" x1="380" y1="182" x2="284" y2="230" marker-end="url(#{{ $id }}-a)"/>
  <line class="line" x1="700" y1="82" x2="570" y2="117" marker-end="url(#{{ $id }}-a)"/>
  <line class="line" x1="800" y1="82" x2="800" y2="116" marker-end="url(#{{ $id }}-a)"/>
  <path class="line" d="M922,50 H945 V318 H250 V296" marker-end="url(#{{ $id }}-a)"/>

  <!-- row 0 -->
  <rect class="box-2" x="40" y="20" width="240" height="60" rx="10"/>
  <text class="t-b" x="58" y="46">tongs-&lt;{{ if $de }}Protokoll{{ else }}protocol{{ end }}&gt;</text>
  <text class="t-sm" x="58" y="66">{{ if $de }}die Tongs, eigene Repositories{{ else }}the Tongs, own repositories{{ end }}</text>
  <rect class="box-2" x="680" y="20" width="240" height="60" rx="10"/>
  <text class="t-b" x="698" y="46">anvild</text>
  <text class="t-sm" x="698" y="66">{{ if $de }}Master des Tongs-Bus{{ else }}master of the Tongs-Bus{{ end }}</text>

  <!-- row 1 -->
  <rect class="box" x="40" y="120" width="240" height="60" rx="10"/>
  <text class="t-b" x="58" y="146">tongs-runtime</text>
  <text class="t-sm" x="58" y="166">{{ if $de }}Prozesse, gemeinsamer Speicher{{ else }}processes, shared memory{{ end }}</text>
  <rect class="box" x="370" y="120" width="220" height="60" rx="10"/>
  <text class="t-b" x="388" y="146">tongs-core</text>
  <text class="t-sm" x="388" y="166">{{ if $de }}Fehlermodell, Statusformat{{ else }}fault model, status format{{ end }}</text>
  <rect class="box-accent" x="680" y="120" width="240" height="60" rx="10"/>
  <text class="t-b" x="698" y="146">forgeiec-tongs-bus</text>
  <text class="t-sm" x="698" y="166">{{ if $de }}Bus-Protokoll, sans-IO{{ else }}bus protocol, sans-IO{{ end }}</text>

  <!-- row 2 -->
  <rect class="box" x="40" y="230" width="240" height="60" rx="10"/>
  <text class="t-b" x="58" y="256">anvil</text>
  <text class="t-sm" x="58" y="276">{{ if $de }}Transport mit C-Schnittstelle{{ else }}transport with C ABI{{ end }}</text>
  <rect class="box-accent" x="370" y="230" width="220" height="60" rx="10"/>
  <text class="t-b" x="388" y="256">forge-device-diag</text>
  <text class="t-sm" x="388" y="276">{{ if $de }}Diagnosemodell{{ else }}diagnosis model{{ end }}</text>
  <rect class="box-accent" x="680" y="230" width="240" height="60" rx="10"/>
  <text class="t-b" x="698" y="256">forge-tongs-params</text>
  <text class="t-sm" x="698" y="276">{{ if $de }}Parametermodell{{ else }}parameter model{{ end }}</text>

  <!-- row 3 -->
  <rect class="box" x="40" y="340" width="240" height="60" rx="10"/>
  <text class="t-b" x="58" y="366">iceoryx2 =0.9.2</text>
  <text class="t-sm" x="58" y="386">{{ if $de }}gemeinsamer Speicher{{ else }}shared memory{{ end }}</text>

  <!-- legend -->
  <rect class="box-accent" x="372" y="346" width="22" height="16" rx="4"/>
  <text class="t-sm" x="404" y="359">{{ if $de }}ohne I/O: testbar ohne gemeinsamen Speicher und Netz{{ else }}no I/O: testable without shared memory or network{{ end }}</text>
  <line class="line line-dash" x1="372" y1="378" x2="394" y2="378"/>
  <text class="t-sm" x="404" y="382">{{ if $de }}nur mit Cargo-Feature „bus“{{ else }}only with Cargo feature "bus"{{ end }}</text>
  <line class="line" x1="372" y1="402" x2="394" y2="402" marker-end="url(#{{ $id }}-a)"/>
  <text class="t-sm" x="404" y="406">{{ if $de }}Pfeil: „benutzt“{{ else }}arrow: "uses"{{ end }}</text>
</svg>
